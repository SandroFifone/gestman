# Configurazione Supervisor per GESTMAN Scheduler Worker
# File: /etc/supervisor/conf.d/gestman-scheduler.conf
#
# Installa questa configurazione con:
#   sudo cp gestman-scheduler.supervisor.conf /etc/supervisor/conf.d/gestman-scheduler.conf
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start gestman-scheduler

[program:gestman-scheduler]
command=/home/%(ENV_USER)s/gestman-app/backend/venv/bin/python /home/%(ENV_USER)s/gestman-app/backend/scheduler_worker.py
directory=/home/%(ENV_USER)s/gestman-app/backend
user=%(ENV_USER)s
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=600
redirect_stderr=true
stdout_logfile=/var/log/gestman-scheduler.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/gestman-scheduler-error.log
environment=PYTHONPATH="/home/%(ENV_USER)s/gestman-app/backend",LANG="en_US.UTF-8",LC_ALL="en_US.UTF-8"

# Priority: avvia dopo altri servizi ma prima dell'applicazione principale
priority=100
